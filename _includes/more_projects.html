<div class="site-section pb-0">
  <div class="container">
    <div class="row justify-content-center text-center mb-4">
      <div class="col-5">
        <h3 class="h3 heading font-weight-bold" id="myProjects">More Projects</h3>
      </div>
    </div>

    <div class="row" data-aos="fade-up" data-aos-delay="200">
      {% for project in site.data.projects %}
      <div class="item col-sm-6 col-md-4 col-lg-4 mb-4">
        <a href="{{ project.link }}" class="item-wrap fancybox item-wrap-visible">
          <div class="work-info">
            {% assign titles = project.title | split: "||" %}
            {% for t in titles %}
              <h2>{{ t }}</h2>
            {% endfor %}
          </div>
          <img class="img-fluid" src="{{ project.image }}">
        </a>
      </div>
      {% endfor %}
    </div>
  </div>
</div>
